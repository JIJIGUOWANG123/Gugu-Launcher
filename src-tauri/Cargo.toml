[package]
name = "gugu-launcher"
version = "1.0.1"
description = "咕咕启动器 · Gugu Launcher — Minecraft 开源无广告启动器"
authors = ["JIJIGUOWANG123"]
repository = "https://github.com/JIJIGUOWANG123/Gugu-Launcher"
homepage = "https://github.com/JIJIGUOWANG123/Gugu-Launcher"
license = "MIT"
edition = "2021"
rust-version = "1.77"

# 生成库名与前端无关：Windows 下 Tauri 需要 staticlib/cdylib，单测需要 rlib。
[lib]
name = "gugu_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# tauri build 会自动带上；手动 cargo build --release 时也要指定，才会把 dist 嵌入 exe
custom-protocol = ["tauri/custom-protocol"]

# 可执行文件名固定 GuguLauncher.exe（与 tauri.conf.json 的 mainBinaryName 一致）
[[bin]]
name = "GuguLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 种子地图：把 third_party/cubiomes 的 C 源码编进 exe（仅构建期依赖）
cc = "1"

[dependencies]
# tray-icon：系统托盘小图标（关闭到托盘的入口）
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled：不依赖系统 sqlite，安装包自带宽版本
rusqlite = { version = "0.32", features = ["bundled"] }
# process：拉起 JVM；sync：并发下载的信号量
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "process", "sync"] }
# rustls：避免 Windows 上依赖 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# 单实例：第二次启动把已有窗口叫到前台（本次唯一新增的 tauri 插件）
tauri-plugin-single-instance = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
sha1 = "0.10"
# 系统字体枚举 + cmap 查询（设置里的「显示字体」只能选真正支持中文的字体）
fontdb = "0.23"
ttf-parser = "0.25"
# 只开 deflate，避免 bzip2/zstd 这些需要 C 工具链的默认特性
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
